name: Publish to Comfy Registry

# Publishes a new version whenever pyproject.toml changes on main (bump the
# version there to release), or when run by hand from the Actions tab.
# Needs a repository secret named REGISTRY_ACCESS_TOKEN holding a Comfy
# Registry API key for the publisher in pyproject.toml.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Teknix420' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
